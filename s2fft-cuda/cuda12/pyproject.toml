# s2fft-cuda12-plugin: the CUDA plugin of s2fft built with CUDA 12, installed by the extras
# s2fft[cuda12] and s2fft[cuda12-local]. The sources are shared with the CUDA 13 plugin in the
# parent directory (s2fft-cuda/); the two files differ only in the CUDA major version.
[build-system]
requires = [
    "scikit-build-core>=0.11.2",
    "setuptools-scm",
    "nanobind>=1.3.2",
    "jax>=0.5.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "s2fft-cuda12-plugin"
description = "CUDA 12 plugin of s2fft: HEALPix ring FFTs on the GPU as JAX FFI custom calls"
authors = [
    {name = "Matthew A. Price"},
    {name = "Jason D. McEwen"},
    {name = "Contributors"},
]
license = {text = "MIT"}
requires-python = ">=3.11"
dynamic = ["version", "dependencies"]
urls.homepage = "https://github.com/astro-informatics/s2fft"

[project.optional-dependencies]
# cuFFT from pip (s2fft[cuda12]); without it the system CUDA is used (s2fft[cuda12-local])
with-cuda = [
    "nvidia-cufft-cu12>=11.0.2.54",
]

[tool.scikit-build]
minimum-version = "0.11"
cmake.source-dir = ".."
cmake.define.S2FFT_PLUGIN_CUDA_MAJOR = "12"
build-dir = "build/{wheel_tag}"
# Stable ABI wheels for CPython 3.12+
wheel.py-api = "cp312"
cmake.build-type = "Release"
# The package files are installed by CMake (s2fft-cuda/CMakeLists.txt)
wheel.packages = []
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
# Local metadata provider (needs experimental): require the jax the plugin is built against
experimental = true
metadata.dependencies.provider = "jax_requirement"
metadata.dependencies.provider-path = "../build_tools"

[[tool.scikit-build.generate]]
path = "s2fft_cuda12_plugin/_version.py"
template = '''
__version__ = "${version}"
'''

[tool.setuptools_scm]
# The git repository root, relative to this file
root = "../.."
local_scheme = "no-local-version"

[tool.uv]
# Rebuild when the C++/CUDA sources change
cache-keys = [
    { file = "pyproject.toml" },
    { file = "../CMakeLists.txt" },
    { file = "../python/*.in" },
    { file = "../build_tools/*.py" },
    { file = "../lib/**/*.cu" },
    { file = "../lib/**/*.cc" },
    { file = "../lib/**/*.h" },
    { file = "../lib/**/*.hpp" },
    { file = "../lib/**/*.cuh" },
]
